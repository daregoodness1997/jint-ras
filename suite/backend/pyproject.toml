[project]
name = "research-suite-backend"
version = "0.1.0"
description = "Fullstack research suite backend for comprehensive snakeboard gait testing."
authors = [{name = "Dare Goodness", email = "daregoodness@gmail.com"}]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn[standard] (>=0.32.0,<1.0.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "python-multipart (>=0.0.9,<0.1.0)",
    "numpy (>=1.26.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "websockets (>=13.0,<15.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
